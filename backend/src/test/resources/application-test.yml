server:
  port: 0

spring:
  application:
    name: building-access-control-test

  datasource:
    url: jdbc:h2:mem:testdb-${random.uuid};DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        # application.yml (main) eksplicitno postavlja MySQLDialect — ovde ga moramo eksplicitno
        # prepisati na H2, jer profil-specifični YAML samo dodaje/prepisuje navedene ključeve
        # (ne briše ključeve iz baznog application.yml koji ovde nisu ponovo navedeni).
        dialect: org.hibernate.dialect.H2Dialect

  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    secret: test-only-secret-key-not-for-production-use-min-32-bytes-long
    expiration-ms: 86400000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
